aid: google-sites
name: Google Sites
description: >-
  Google Sites is Google's no-code website builder, bundled with Google Workspace and
  available at no cost to consumer Google Accounts. Its only public programmatic surface
  is the Google Sites Data API, a Google Data (GData) v1.4 Atom/XML API served from
  https://sites.google.com/feeds/ across five feeds — Site, Content, Revision, Activity
  and ACL — that list and create sites, read and write pages, announcements, file
  cabinets, list pages and attachments, walk revision history and activity, and manage
  sharing permissions. Google marks the API DEPRECATED on every documentation page and
  states it "might stop working at any time"; critically, it reaches only classic Google
  Sites and cannot touch the rebuilt Sites launched on 2016-11-22, which is the only
  version a user can create today. Google publishes no OpenAPI or discovery document for
  it, no replacement API for new Sites, no webhooks, no rate limits and no MCP server.
  Authorization is OAuth 2.0 with one coarse read-and-write scope. The two first-party
  client libraries are the generic GData Python and Java libraries, both archived, last
  published in 2013 and 2012.
