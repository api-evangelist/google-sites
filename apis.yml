x-enrichment:
  date: '2026-09-12'
  status: enriched
  artifacts_added: 14
  pass: local-v3
  notes: >-
    Contract discovery (STEP 0b) run in full. The Google Sites Data API publishes NO
    OpenAPI: it is absent from Google's own discovery directory (530 services returned by
    https://www.googleapis.com/discovery/v1/apis on 2026-09-12, none named `sites`), and
    https://www.googleapis.com/discovery/v1/apis/sites/v1/rest returns 404. The apis.yml
    baseURL https://sites.googleapis.com and the OpenAPI pointer
    https://sites.googleapis.com/$discovery/rest?version=v1 were both WRONG and were
    corrected/removed: that host answers 403 PERMISSION_DENIED to anonymous callers and
    serves no public discovery document. The documented contract is the GData v1.4
    Atom/XML feed surface at https://sites.google.com/feeds/, and the API is DEPRECATED,
    classic-Sites-only. No GraphQL, no MCP server, no A2A agent card, no AsyncAPI, no
    gRPC, no WSDL, no llms.txt, no OGC surface.
