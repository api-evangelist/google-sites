apis:
  - name: Google Sites Data API
    description: >-
      The Google Sites Data API is a Google Data (GData) v1.4 Atom/XML API for classic
      Google Sites. Five feeds — Site, Content, Revision, Activity and ACL — let a client
      list, create, copy and rename sites (create and copy are Google Workspace domains
      only), create, update and delete webpages, announcements, file cabinets, list pages,
      list items, comments and attachments, read revision history and site activity, and
      manage sharing permissions. Every request carries a GData-Version: 1.4 header;
      entries carry gd:etag for optimistic concurrency via If-Match / If-None-Match;
      batch requests bundle query, insert, update and delete operations non-atomically.
      DEPRECATED: it cannot access the rebuilt Google Sites launched 2016-11-22, and
      Google publishes no successor API.
    image: https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png
