specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google Sites
providerId: google-sites
generated: '2026-09-12'
method: searched
source: https://workspace.google.com/pricing
created: '2026-05-04'
modified: '2026-09-12'
tags:
  - Collaboration
  - Content Management
  - Google Workspace
  - Websites
description: >-
  Plans and pricing for Google Sites. The Google Sites Data API has NO pricing page and
  NO API-specific plan of its own - there is no metering, no request quota and no
  overage. Access is a function of the Google Workspace subscription that includes the
  Sites product, so the tiers below are the published Google Workspace plans read from
  workspace.google.com/pricing on 2026-09-12. Google Sites is also available at no cost
  to consumer Google Accounts. This file REPLACES a 2026-05-04 bulk-sweep scaffold that
  invented free/professional/enterprise API tiers with request quotas and "TBD"
  overage pricing; none of that was ever published by Google.
api_pricing:
  metered: false
  separate_api_plan: false
  api_pricing_url: null
  note: >-
    No per-call price, no request quota, no overage. The deprecated Sites Data API is
    included with the product at no additional charge.
plan_count: 5
currency: USD
billing_period: month
billing_unit: per user
plans:
  - id: google-sites-consumer
    name: Personal (consumer Google Account)
    type: free
    price: '0.00'
    currency: USD
    billing_period: month
    description: >-
      Google Sites is available at no cost with a personal Google Account. Site
      creation and copy through the Sites Data API site feed are NOT available on
      consumer accounts - the protocol guide restricts those to Workspace domains.
    source: https://workspace.google.com/products/sites/
  - id: google-workspace-business-starter
    name: Business Starter
    type: paid
    price: '7.00'
    currency: USD
    billing_period: month
    billing_unit: per user
    max_users: 300
    included:
      - 30 GB pooled storage per user
      - Custom business email
      - Gemini AI assistant in Gmail
      - Google Sites
    source: https://workspace.google.com/pricing
  - id: google-workspace-business-standard
    name: Business Standard
    type: paid
    price: '14.00'
    currency: USD
    billing_period: month
    billing_unit: per user
    max_users: 300
    included:
      - 2 TB pooled storage per user
      - Custom layouts and mail merge
      - Gemini AI assistant in Gmail, Docs, Meet
      - Google Sites
    source: https://workspace.google.com/pricing
  - id: google-workspace-business-plus
    name: Business Plus
    type: paid
    price: '22.00'
    currency: USD
    billing_period: month
    billing_unit: per user
    max_users: 300
    included:
      - 5 TB pooled storage per user
      - eDiscovery
      - Video meetings with attendance tracking, 500 participants
      - Google Sites
    source: https://workspace.google.com/pricing
  - id: google-workspace-enterprise
    name: Enterprise
    type: enterprise
    price: custom
    currency: USD
    billing_period: month
    billing_unit: per user
    max_users: null
    contact_sales: true
    included:
      - 5 TB pooled storage per user or more
      - S/MIME encryption
      - In-domain live streaming, 1000 participants
      - Google Sites
    source: https://workspace.google.com/pricing
trial:
  available: true
  length_days: 14
  note: '"Try now - No cost for 14 days" on Starter, Standard and Plus.'
notes:
  - >-
    Prices are the published monthly-billed list prices in USD as shown on
    workspace.google.com/pricing on 2026-09-12. Google was running a promotional 30%
    discount for the first three months and offers ~16% off for an annual commitment;
    promotional prices are deliberately not recorded as the plan price.
  - >-
    Starter, Standard and Plus are capped at 300 users. Enterprise has no user cap.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
