note: >-
  HONEST ZERO. Google publishes no rate limits, quotas, throttling behaviour or
  exhaustion signal for the Google Sites Data API. Full-text search of the API's
  protocol guide and reference guide on 2026-09-12 found zero occurrences of "quota",
  "rate limit", "429", "503" or "Retry-After". The API is not listed in the Google
  Cloud console quota surface because it is not a Cloud/Discovery API - it is a legacy
  GData service reached at sites.google.com/feeds. An integrator has no published
  number to design against and no runtime header to back off on.
  This file REPLACES a 2026-05-04 bulk-sweep scaffold that asserted invented
  X-RateLimit-* headers and 10/100/1000 requests-per-minute free/professional/
  enterprise tiers. None of that was ever published by Google.
