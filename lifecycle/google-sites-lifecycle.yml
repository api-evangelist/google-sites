client_library_decay:
  note: >-
    See packages/google-sites-packages.yml. The only two first-party clients last
    shipped in 2013 (PyPI gdata 2.0.18) and 2012 (Maven com.google.gdata:core 1.47.1),
    and both source repositories are archived.
