  from api.github.com
note: >-
  The Google Sites Data API has no dedicated SDK. Google publishes exactly two
  first-party client libraries for it, and both are the GENERIC Google Data (GData)
  client libraries - the Sites API is one of many GData services they wrap. The Sites
  developer guide links only the Python and Java GData libraries; no JavaScript, Go,
  .NET, Ruby, PHP or Rust client exists for this surface. Both libraries are
  long-abandoned and their GitHub repositories are ARCHIVED: the Python library last
  published to PyPI in 2013 and the Java core artifact last published to Maven Central
  in 2012. This is the strongest decay evidence available for this API and it is
  provider-published: the client libraries stopped shipping more than a decade before
  the API's own deprecation banner went up.
